<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Flames</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-body">
  <header class="site-header">
    <a class="brand" href="index.html">Flames<small class="admin-label">ADMIN</small></a>
    <nav class="main-nav"><a href="index.html">View website ↗</a></nav>
  </header>

  <main class="admin-main">
    <section id="login-panel" class="login-card">
      <p class="eyebrow">PRIVATE AREA</p>
      <h1>Admin sign in</h1>
      <p class="muted">Sign in using the email and password you added in Firebase Authentication.</p>
      <form id="login-form" class="stack-form">
        <label>Email address<input id="login-email" type="email" autocomplete="username" required></label>
        <label>Password<input id="login-password" type="password" autocomplete="current-password" required></label>
        <button class="button button-dark" type="submit">Sign in</button>
        <p id="login-message" class="form-message" role="status"></p>
      </form>
    </section>

    <section id="dashboard" class="hidden admin-dashboard">
      <div class="article-editor-topbar">
        <div class="editor-top-left"><button id="reset-editor" class="editor-close" type="button" aria-label="Clear editor">×</button><span id="editor-heading">Article Page</span></div>
        <div class="editor-top-actions"><button class="button button-light" type="button" id="editor-cancel">Cancel</button><button class="button button-dark" type="submit" form="post-form" id="publish-button">Publish</button></div>
      </div>
      <div class="article-editor-grid">
        <section class="article-editor-main">
          <form id="post-form" class="stack-form">
            <input id="post-id" type="hidden">
            <input id="post-status" type="hidden" value="published">
            <div class="form-two editor-title-slug">
              <label>Title <span class="field-muted">(Name your blog)</span><input id="post-title" maxlength="160" required placeholder="Name your blog"></label>
              <label>Slug <span class="field-muted">(URL name only, e.g. gold-rate-past-5-years)</span><input id="post-slug" placeholder="blog-url-slug"></label>
            </div>
            <label>Content <span class="field-muted">(Write your blog post)</span></label>
            <div class="editor-toolbar" role="toolbar" aria-label="Text formatting">
              <select id="text-style" aria-label="Text style"><option value="p">Normal Text</option><option value="h2">Heading 2</option><option value="h3">Heading 3</option><option value="h4">Heading 4</option></select>
              <button type="button" data-command="bold" title="Bold"><strong>B</strong></button>
              <button type="button" data-command="italic" title="Italic"><em>I</em></button>
              <button type="button" data-command="underline" title="Underline"><u>U</u></button>
              <button type="button" id="insert-link" title="Insert link">🔗</button>
              <button type="button" id="insert-quote" title="Quote">❝</button>
              <button type="button" id="insert-code" title="Code block">&lt;/&gt;</button>
              <button type="button" id="insert-image" title="Insert image">▧</button>
              <button type="button" data-command="insertUnorderedList" title="Bulleted list">☷</button>
              <button type="button" data-command="insertOrderedList" title="Numbered list">1.</button>
              <button type="button" id="insert-youtube" title="YouTube">▶</button>
              <button type="button" id="insert-table" title="Table">▦</button>
              <button type="button" id="insert-graph" title="Insert graph">📊 Graph</button>
              <button type="button" data-command="removeFormat" title="Clear format">Clear</button>
              <label class="toolbar-color" title="Article content background">BG <input id="editor-bg-color" type="color" value="#ffffff" aria-label="Editor background color"></label>
              <label class="toolbar-color" title="Code block background">Code BG <input id="code-bg-color" type="color" value="#19232e" aria-label="Code block background color"></label>
              <label class="toolbar-color" title="Code text color">Code Text <input id="code-text-color" type="color" value="#f4f7fb" aria-label="Code text color"></label>
            </div>
            <div id="post-content" class="rich-editor" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Start writing your article here…" aria-label="Article content"></div>
            <div class="editor-bottom-actions"><button class="button button-light" id="preview-post" type="button">Preview</button><button class="button button-light" type="submit" id="save-draft-button">Save Draft</button><button class="button button-dark" type="submit" id="publish-bottom">Publish</button></div>
            <p id="post-message" class="form-message" role="status"></p>
          </form>
        </section>
        <aside class="article-editor-sidebar">
          <label>Excerpt <span class="field-muted">(Add a short excerpt to summarize this post)</span><textarea id="post-excerpt" rows="5" maxlength="300" placeholder="Short summary of your post"></textarea></label>
          <label>Category <span class="field-muted">(Select a category your blog belongs to)</span><select id="post-category" required>
            <option>Technology</option><option>Mystery</option><option>Horror</option><option>True Stories</option><option>Science</option><option>History</option><option>Interesting Facts</option><option>Other</option><option>Research</option><option>Business</option><option>Games</option><option>News</option><option>Products</option><option>Vehicle</option><option>Actor</option><option>Book</option>
          </select></label>
          <label>Date <span class="field-muted">(Article date)</span><input id="post-date" type="date"></label>
          <label>Cover Image <span class="field-muted">(Cover image URL)</span><input id="post-image" type="url" placeholder="https://example.com/cover.jpg"></label>
          <div class="cover-preview" id="cover-preview"><span>▧</span><small>Cover image preview</small></div>
          <label>Status<select id="status-sidebar"><option value="draft">Draft</option><option value="published">Published</option></select></label>
          <div class="section-heading article-list-heading"><h2>Your articles</h2><span id="post-count" class="count-pill">0</span></div>
          <div id="admin-post-list" class="admin-post-list"><p class="muted">Loading your articles…</p></div>
          <button id="sign-out" class="button button-light signout-sidebar" type="button">Sign out</button>
        </aside>
      </div>
    </section>
  </main>
  <dialog id="graph-dialog" class="graph-dialog" aria-label="Insert chart">
    <form method="dialog" id="graph-form">
      <div class="graph-dialog-head"><div><p class="eyebrow">CONTENT BLOCK</p><h2>Insert graph</h2></div><button type="button" id="close-graph" class="editor-close">×</button></div>
      <div class="graph-controls">
        <label>Chart type<select id="graph-type"><option value="bar">Bar chart</option><option value="line">Line graph</option><option value="pie">Pie chart</option></select></label>
        <label>Chart title<input id="graph-title" placeholder="Chart title"></label>
        <label>Data <span class="field-muted">(one Label,Value per line — use a new line for each row)</span><textarea id="graph-data" rows="5" placeholder="1998,500&#10;2003,1000&#10;2005,5000&#10;2028,130"></textarea></label>
        <label>Graph color<input id="graph-color" type="color" value="#3157d5"></label>
        <label>Graph background<input id="graph-bg-color" type="color" value="#ffffff"></label>
        <label>Value format<select id="graph-suffix"><option value="">No suffix</option><option value=" Cr">Cr</option><option value=" Million">Million</option><option value="%">%</option><option value="custom">Custom</option></select></label>
        <label id="graph-custom-suffix-wrap" hidden>Custom suffix<input id="graph-custom-suffix" placeholder="e.g. points, km, USD"></label>
      </div>
      <div class="graph-preview"><canvas id="graph-canvas" width="720" height="380"></canvas></div>
      <div class="graph-dialog-actions"><button type="button" id="graph-cancel" class="button button-light">Cancel</button><button type="button" id="graph-insert" class="button button-dark">Insert into article</button></div>
    </form>
  </dialog>
  <dialog id="code-dialog" aria-label="Insert code block" style="border:1px solid #ddd;border-radius:14px;padding:24px;width:min(560px,90vw);box-shadow:0 15px 50px #0003">
    <form method="dialog" id="code-form" style="display:grid;gap:12px">
      <h2 style="margin:0">Insert code block</h2>
      <label for="code-input">Paste your code or text</label>
      <textarea id="code-input" rows="10" spellcheck="false" style="width:100%;font-family:monospace;padding:12px;border:1px solid #ccc;border-radius:8px;resize:vertical"></textarea>
      <div class="code-color-fields">
        <label>Block background <input id="dialog-code-bg" type="color" value="#19232e"></label>
        <label>Text color <input id="dialog-code-text" type="color" value="#f4f7fb"></label>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:10px"><button type="button" id="cancel-code" class="small-button">Cancel</button><button type="submit" class="button button-dark">Insert code</button></div>
    </form>
  </dialog>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
